{% extends "master.html" %}

{% block title %}All Passwords{% endblock %}

{% block content %}
    <h1>All Passwords</h1>

    <div class="flex-center">
        <a href="/new/" class="button">+ New Password</a>
        <form method="post" action="backup/" style="all: unset;">
            {%csrf_token%}
            <button type="submit" class="main-btn">Backup</button>
        </form>
        <a href="/notes/" class="button">Notes</a>
        <a href="/settings/" class="button">Settings</a>
        <a href="/logout" class="button" style="color: var(--danger-color); border-color: #3a1a1a;">Logout</a>
    </div>
        <!-- This div will get the card styling -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:22%">Name</th>
                        <th style="width:25%">Username</th>
                        <th style="width:28%">Password</th>
                        <th style="width:25%">Actions</th>
                    </tr>
                </thead>
                <tbody id="passwords-tbody">
                    <tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:3rem 0;">
                        <i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i>Decrypting passwords…
                    </td></tr>
                </tbody>
            </table>

            <form id="passwords-upload" method="post" action="upload/" enctype="multipart/form-data" style="all:unset;display:flex;flex-wrap:wrap;align-items:center;gap:1rem;padding-top:20px;margin-top:20px;border-top:1px solid var(--card-border);">
                {% csrf_token %}
                <input type="hidden" name="encrypted_content" id="upload-enc-content" value="">
                <label style="color:var(--text-muted);font-size:0.85rem;margin:0;"><i class="fa-solid fa-file-csv" style="margin-right:6px;"></i>Import CSV</label>
                <input type="file" id="passwordfile" name="passwordfile" accept=".csv" style="color:var(--text-secondary);font-size:0.9rem;flex:1;">
                <button type="submit" style="margin:0;padding:10px 20px;background:var(--primary-gradient);border:none;border-radius:10px;color:#fff;font-weight:600;cursor:pointer;font-size:0.9rem;">Upload</button>
            </form>
        </div>

        <script>
        function togglePassword(button) {
            const passwordInput = button.parentElement.querySelector('.password-input');
            const icon = button.querySelector('i');

            if (passwordInput.classList.contains('password-hidden')) {
                passwordInput.classList.remove('password-hidden');
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                button.title = 'Hide Password';
            } else {
                passwordInput.classList.add('password-hidden');
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                button.title = 'Show Password';
            }
        }

        function copyPassword(button) {
            const row = button.closest('tr');
            const passwordInput = row.querySelector('.password-input');

            if (!passwordInput) return;

            navigator.clipboard.writeText(passwordInput.value).then(() => {
                button.title = "Copied!";
                setTimeout(() => {
                    button.title = "Copy Password";
                }, 1000);
            }).catch(() => {
                alert("Failed to copy password.");
            });
        }

        document.addEventListener('DOMContentLoaded', async function() {
            const encryptedContent = "{{ content|escapejs }}";
            const masPassword = "{{ mas_password|escapejs }}";

            const tbody = document.getElementById('passwords-tbody');
            let dataList = [];

            if (encryptedContent && encryptedContent.trim() !== "") {
                dataList = await denc(encryptedContent, masPassword);
            }

            tbody.innerHTML = ''; // clear loading spinner

            if (dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:3rem 0;"><i class="fa-solid fa-lock" style="margin-right:8px;opacity:0.4;"></i>No passwords yet. Add your first one!</td></tr>';
                return;
            }

            dataList.forEach((element, index) => {
                if (!Array.isArray(element)) return;
                const name = element[0] || "";
                const uname = element[1] || "";
                const pass = element[2] || "";

                const escapeHtml = (unsafe) => {
                    return (unsafe||"").toString()
                         .replace(/&/g, "&amp;")
                         .replace(/</g, "&lt;")
                         .replace(/>/g, "&gt;")
                         .replace(/"/g, "&quot;")
                         .replace(/'/g, "&#039;");
                 }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                        <td data-label="Name">
                            <input type="text" class="pass-info" id="name-${index}" value="${escapeHtml(name)}">
                        </td>
                        <td data-label="Username">
                            <input type="text" class="pass-info" id="uname-${index}" value="${escapeHtml(uname)}">
                        </td>
                        <td class="password-cell" data-label="Password">
                            <input type="text" class="password-input password-hidden" id="pass-${index}" value="${escapeHtml(pass)}">
                            <span class="password-toggle" onclick="togglePassword(this)">
                                <i class="fa-solid fa-eye"></i>
                            </span>
                        </td>
                        <td class="action-icons" data-label="Actions">
                            <div class="icon-group">
                                <button type="button" onclick="copyPassword(this)" title="Copy Password">
                                    <i class="fa-solid fa-copy"></i>
                                </button>
                                <button type="button" onclick="handleAction(${index}, 'Edit')" title="Save Changes">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                </button>
                                <button type="button" onclick="handleAction(${index}, 'Delete')" title="Delete Entry" style="color:var(--danger-color);">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </td>
                `;
                tbody.appendChild(tr);
            });

            const passwordInputs = document.querySelectorAll('.password-input');
            passwordInputs.forEach(input => {
                input.classList.add('password-hidden');
            });
        });

        async function handleAction(index, action) {
            const encryptedContentStr = "{{ content|escapejs }}";
            const masPassword = "{{ mas_password|escapejs }}";
            let dataList = await denc(encryptedContentStr, masPassword);

            if (action === 'Delete') {
                dataList.splice(index, 1);
            } else if (action === 'Edit') {
                dataList[index][0] = document.getElementById(`name-${index}`).value || " ";
                dataList[index][1] = document.getElementById(`uname-${index}`).value || " ";
                dataList[index][2] = document.getElementById(`pass-${index}`).value || " ";
            }

            dataList = dataList.filter(item => Array.isArray(item) && item.length > 0);
            dataList.sort((a, b) => String(a[0]).localeCompare(String(b[0]), undefined, {sensitivity: 'accent'}));

            const newEncrypted = await enc(dataList, masPassword);

            const form = document.createElement('form');
            form.method = 'post';
            form.action = `update/${index}`;
            form.style.cssText = 'position:fixed;left:-9999px;top:-9999px;visibility:hidden;';

            const csrf = document.createElement('input');
            csrf.type = 'hidden';
            csrf.name = 'csrfmiddlewaretoken';
            csrf.value = '{{ csrf_token }}';
            form.appendChild(csrf);

            const encInput = document.createElement('input');
            encInput.type = 'hidden';
            encInput.name = 'encrypted_content';
            encInput.value = newEncrypted;
            form.appendChild(encInput);

            document.body.appendChild(form);
            form.submit();
        }

        document.getElementById('passwords-upload').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('passwordfile');
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            const text = await file.text();

            const rows = text.split('\n').map(r => r.trim()).filter(r => r);
            rows.shift();

            const newData = [];
            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length >= 3) {
                    newData.push([cols[0].trim(), cols[1].trim(), cols[2].trim()]);
                }
            });

            const encryptedContentStr = "{{ content|escapejs }}";
            const masPassword = "{{ mas_password|escapejs }}";
            let dataList = [];
            if (encryptedContentStr && encryptedContentStr.trim() !== "") {
                dataList = await denc(encryptedContentStr, masPassword);
            }

            dataList.push(...newData);
            dataList = dataList.filter(item => Array.isArray(item) && item.length > 0);
            dataList.sort((a, b) => String(a[0]).localeCompare(String(b[0]), undefined, {sensitivity: 'accent'}));

            const newEncrypted = await enc(dataList, masPassword);
            document.getElementById('upload-enc-content').value = newEncrypted;

            this.submit();
        });
        </script>
{% endblock %}
