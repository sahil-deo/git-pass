{% extends "master.html" %}
{% block title %}Notes — Git-Pass{% endblock %}

{% block head %}
<style>
/* Override master.html gradient styles for a plain minimal look */
body {
    background: #0f0f0f;
    background-image: none;
}
.content-wrapper { max-width: 1100px; }

/* Nav */
.notes-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 2rem;
}
.notes-nav h1 {
    margin: 0;
    font-size: 1.4rem;
    color: #e5e5e5;
    font-weight: 600;
    letter-spacing: -0.02em;
    background: none;
    -webkit-text-fill-color: unset;
}
.notes-nav-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.nav-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: #1a1a1a;
    color: #a0a0a0;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, color 0.15s;
}
.nav-btn:hover { background: #222; color: #e5e5e5; text-shadow: none; }
.nav-btn.primary { background: #1a1a1a; border-color: #3a3a3a; color: #e5e5e5; }
.nav-btn.danger  { border-color: #3a1a1a; color: #f87171; }
.nav-btn.danger:hover { background: #1f1010; }

/* Label tabs */
.label-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #1e1e1e;
}
.label-tab {
    padding: 5px 14px;
    border-radius: 6px;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: #6b6b6b;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
}
.label-tab:hover { border-color: #3a3a3a; color: #a0a0a0; }
.label-tab.active { background: #1e1e1e; border-color: #3a3a3a; color: #e5e5e5; }

/* Card grid */
#notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
}

/* Note card */
.note-card {
    background: #141414;
    border: 1px solid #1e1e1e;
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: default;
    transition: border-color 0.15s;
}
.note-card:hover { border-color: #2a2a2a; }

.card-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #5a5a5a;
}
.card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #d4d4d4;
    line-height: 1.3;
}
.card-content {
    font-size: 0.85rem;
    color: #6b6b6b;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.note-card.editing .card-content,
.note-card.editing .card-title,
.note-card.editing .card-label { display: none; }

/* Edit inputs */
.edit-field {
    display: none;
    width: 100%;
    background: #0f0f0f;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 9px 12px;
    color: #d4d4d4;
    font-size: 0.88rem;
    font-family: inherit;
    resize: none;
    transition: border-color 0.15s;
}
.edit-field:focus { outline: none; border-color: #444; }
.note-card.editing .edit-field { display: block; }

/* Card footer */
.card-footer {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    justify-content: flex-end;
    flex-wrap: wrap;
}
.card-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: #6b6b6b;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
}
.card-btn:hover { background: #1e1e1e; color: #d4d4d4; }
.card-btn.save-btn  { color: #a3c4f3; border-color: #1e2a3a; display: none; }
.card-btn.save-btn:hover { background: #0f1a2a; }
.card-btn.cancel-btn { display: none; }
.card-btn.delete-btn { color: #f87171; border-color: #2a1a1a; }
.card-btn.delete-btn:hover { background: #1a0f0f; }

.note-card.editing .save-btn   { display: inline-flex; }
.note-card.editing .cancel-btn { display: inline-flex; }
.note-card.editing .edit-btn   { display: none; }

/* Empty / loading */
.notes-status {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
    color: #3a3a3a;
    font-size: 0.9rem;
}

@media (max-width: 600px) {
    .notes-nav { flex-direction: column; align-items: flex-start; }
    #notes-grid { grid-template-columns: 1fr; }
}
</style>
{% endblock %}

{% block content %}

<div class="notes-nav">
    <h1>Notes</h1>
    <div class="notes-nav-actions">
        <a href="/notes/new/" class="nav-btn primary">+ New Note</a>
        <a href="/passwords/" class="nav-btn">Passwords</a>
        <a href="/settings/" class="nav-btn">Settings</a>
        <a href="/logout" class="nav-btn danger">Logout</a>
    </div>
</div>

<div class="label-tabs" id="label-tabs">
    <button class="label-tab active" data-label="" onclick="filterLabel(this, '')">All</button>
</div>

<div id="notes-grid">
    <div class="notes-status">Loading…</div>
</div>

<script>
const escHtml = s => (s || '').toString()
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');

// allNotes[i] = { note: {title,label,content}, realIndex: i }
let allNotes = [];
let activeLabel = '';

function filterLabel(btn, label) {
    document.querySelectorAll('.label-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeLabel = label;
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('notes-grid');
    grid.innerHTML = '';

    // FIX: filter on n.note.label, not n.label
    const filtered = activeLabel
        ? allNotes.filter(n => (n.note.label || '').toLowerCase().trim() === activeLabel)
        : allNotes;

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="notes-status">${activeLabel ? 'No notes with this label.' : 'No notes yet.'}</div>`;
        return;
    }

    filtered.forEach(({ note, realIndex }) => {
        grid.appendChild(buildCard(note, realIndex));
    });
}

function buildCard(note, index) {
    const card = document.createElement('div');
    card.className = 'note-card';
    card.dataset.index = index;

    card.innerHTML = `
        ${note.label ? `<div class="card-label">${escHtml(note.label)}</div>` : ''}
        <div class="card-title">${escHtml(note.title) || '<span style="opacity:.35;font-style:italic;font-weight:400;">Untitled</span>'}</div>
        <div class="card-content">${escHtml(note.content)}</div>

        <input   class="edit-field" id="edit-title-${index}"   type="text"  value="${escHtml(note.title)}"   placeholder="Title">
        <input   class="edit-field" id="edit-label-${index}"   type="text"  value="${escHtml(note.label)}"   placeholder="Label">
        <textarea class="edit-field" id="edit-content-${index}" rows="5"    placeholder="Note content…">${escHtml(note.content)}</textarea>

        <div class="card-footer">
            <button class="card-btn delete-btn"  onclick="doDelete(${index})"><i class="fa-solid fa-trash"></i> Delete</button>
            <button class="card-btn cancel-btn"  onclick="toggleEdit(${index}, false)">Cancel</button>
            <button class="card-btn save-btn"    onclick="doSave(${index})"><i class="fa-solid fa-floppy-disk"></i> Save</button>
            <button class="card-btn edit-btn"    onclick="toggleEdit(${index}, true)"><i class="fa-solid fa-pen"></i> Edit</button>
        </div>
    `;

    const ta = card.querySelector('textarea');
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });

    return card;
}

function toggleEdit(index, on) {
    const card = document.querySelector(`.note-card[data-index="${index}"]`);
    if (!card) return;
    card.classList.toggle('editing', on);
    if (on) {
        const ta = card.querySelector('textarea');
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
        document.getElementById(`edit-title-${index}`).focus();
    }
}

async function doSave(index) {
    const encStr = "{{ encrypted_content|escapejs }}";
    const pw     = "{{ mas_password|escapejs }}";
    let notes = await denc(encStr, pw);
    notes[index] = {
        title:   document.getElementById(`edit-title-${index}`).value   || '',
        label:   document.getElementById(`edit-label-${index}`).value   || '',
        content: document.getElementById(`edit-content-${index}`).value || ''
    };
    await submitForm(index, notes, pw);
}

async function doDelete(index) {
    if (!confirm('Delete this note?')) return;
    const encStr = "{{ encrypted_content|escapejs }}";
    const pw     = "{{ mas_password|escapejs }}";
    let notes = await denc(encStr, pw);
    notes.splice(index, 1);
    await submitForm(index, notes, pw);
}

async function submitForm(index, notes, pw) {
    const newEnc = await enc(notes, pw);
    const form   = document.createElement('form');
    form.method  = 'post';
    form.action  = `/notes/update/${index}`;
    form.style.cssText = 'position:fixed;left:-9999px;top:-9999px;visibility:hidden;';

    [['csrfmiddlewaretoken', '{{ csrf_token }}'], ['encrypted_content', newEnc]].forEach(([name, val]) => {
        const inp = document.createElement('input');
        inp.type = 'hidden'; inp.name = name; inp.value = val;
        form.appendChild(inp);
    });

    document.body.appendChild(form);
    form.submit();
}

document.addEventListener('DOMContentLoaded', async () => {
    const encStr = "{{ encrypted_content|escapejs }}";
    const pw     = "{{ mas_password|escapejs }}";

    let raw = [];
    if (encStr && encStr.trim()) raw = await denc(encStr, pw);

    allNotes = raw.map((note, i) => ({ note, realIndex: i }));

    // Build label tabs from actual data
    const labelSet = new Set();
    raw.forEach(n => { if (n.label && n.label.trim()) labelSet.add(n.label.trim().toLowerCase()); });
    const tabs = document.getElementById('label-tabs');
    Array.from(labelSet).sort().forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'label-tab';
        btn.textContent = label;
        btn.onclick = () => filterLabel(btn, label);
        tabs.appendChild(btn);
    });

    renderGrid();
});
</script>

{% endblock %}
