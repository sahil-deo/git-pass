{% extends "master.html" %}
{% block title %}Git-Pass — Login{% endblock %}

{% block head %}
<style>
    body { align-items: center; }
    .content-wrapper { max-width: 480px; }
    .brand-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }
    .brand-header .logo-icon {
        font-size: 3rem;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: block;
        margin-bottom: 0.75rem;
    }
    .brand-header h1 {
        font-size: 2rem;
        margin-bottom: 0.25rem;
    }
    .brand-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
    }
</style>
{% endblock %}

{% block content %}

<div class="brand-header">
    <span class="logo-icon"><i class="fa-solid fa-shield-halved"></i></span>
    <h1>Git-Pass</h1>
    <p>Your passwords, encrypted &amp; stored on GitHub.</p>
</div>

<form action="" method="post">
    {% csrf_token %}

    <label for="username">GitHub Username</label>
    <input type="text" name="username" id="username" value="{{ username }}" required placeholder="octocat">

    <label for="token">Personal Access Token</label>
    <input type="text" name="token" id="token" value="{{ token }}" required placeholder="ghp_…">

    <label for="repo">Repository Name</label>
    <input type="text" name="repo" id="repo" value="{{ repo }}" required placeholder="my-passwords-repo">

    <label for="path">Passwords File Name</label>
    <input type="text" name="path" id="path" value="{{ path }}" required placeholder="passwords.enc">

    <label for="notes_path">Notes File Name</label>
    <input type="text" name="notes_path" id="notes_path" value="{{ notes_path }}" required placeholder="notes.enc">

    <label for="mas_password">Master Password</label>
    <input type="password" name="mas_password" id="mas_password" value="{{ mas_password }}" required placeholder="••••••••">

    <input type="submit" name="action" value="View Passwords">
    <a href="instructions/" style="text-align:center;margin-top:0.5rem;font-size:0.9rem;">Setup Instructions</a>
</form>

{% endblock %}
