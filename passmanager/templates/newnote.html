{% extends "master.html" %}
{% block title %}New Note{% endblock %}

{% block content %}

<h1>New Note</h1>

<form action="" method="post" id="new-note-form">
    {% csrf_token %}
    <input type="hidden" name="encrypted_content" id="enc-content" value="">

    <label for="note-title">Title</label>
    <input type="text" id="note-title" placeholder="Note title…">

    <label for="note-label">Label</label>
    <input type="text" id="note-label" placeholder="e.g. work, personal, todo">

    <label for="note-content">Note</label>
    <textarea id="note-content" rows="6" placeholder="Write your note here…"></textarea>

    <input type="submit" value="Save Note">
    <a href="/notes/" style="text-align:center;margin-top:0.5rem;font-size:0.9rem;">← Return to Notes</a>
</form>

<script>
// Auto-resize textarea
function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
}
window.addEventListener('DOMContentLoaded', function () {
    const ta = document.getElementById('note-content');
    if (ta) {
        autoResizeTextarea(ta);
        ta.addEventListener('input', function () { autoResizeTextarea(this); });
    }
});

document.getElementById('new-note-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const title   = document.getElementById('note-title').value || '';
    const label   = document.getElementById('note-label').value || '';
    const content = document.getElementById('note-content').value || '';

    const encryptedContentStr = "{{ encrypted_content|escapejs }}";
    const masPassword = "{{ mas_password|escapejs }}";

    let dataList = [];
    if (encryptedContentStr && encryptedContentStr.trim() !== '') {
        dataList = await denc(encryptedContentStr, masPassword);
    }

    dataList.push({ title, label, content });

    const newEncrypted = await enc(dataList, masPassword);
    document.getElementById('enc-content').value = newEncrypted;
    this.submit();
});
</script>

{% endblock %}
