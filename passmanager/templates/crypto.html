<script>
async function denc(data, password) {
    if (!data || data.trim() === "") return [];
    try {
        const raw = Uint8Array.from(atob(data), c => c.charCodeAt(0));
        const salt = raw.subarray(0, 16);
        const nonce = raw.subarray(16, 32);
        const tag = raw.subarray(32, 48);
        const ciphertext = raw.subarray(48);

        const encoder = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            "raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: salt, iterations: 1000, hash: "SHA-1" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
        );

        const combinedCiphertext = new Uint8Array(ciphertext.length + tag.length);
        combinedCiphertext.set(ciphertext);
        combinedCiphertext.set(tag, ciphertext.length);

        const decrypted = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: nonce }, key, combinedCiphertext
        );
        const decoder = new TextDecoder();
        return JSON.parse(decoder.decode(decrypted));
    } catch (e) {
        console.error("Decryption failed", e);
        return [];
    }
}

async function enc(dataArr, password) {
    const data = JSON.stringify(dataArr);
    const encoder = new TextEncoder();
    const encodedData = encoder.encode(data);
    
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const nonce = crypto.getRandomValues(new Uint8Array(16));
    
    const keyMaterial = await crypto.subtle.importKey(
        "raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 1000, hash: "SHA-1" },
        keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt"]
    );

    const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: nonce }, key, encodedData
    );
    
    const encryptedBytes = new Uint8Array(encrypted);
    const ciphertext = encryptedBytes.subarray(0, encryptedBytes.length - 16);
    const tag = encryptedBytes.subarray(encryptedBytes.length - 16);
    
    const blob = new Uint8Array(salt.length + nonce.length + tag.length + ciphertext.length);
    blob.set(salt, 0);
    blob.set(nonce, salt.length);
    blob.set(tag, salt.length + nonce.length);
    blob.set(ciphertext, salt.length + nonce.length + tag.length);
    
    let binary = '';
    for (let i = 0; i < blob.byteLength; i++) {
        binary += String.fromCharCode(blob[i]);
    }
    return btoa(binary);
}
</script>
